      - name: Apply Gradle Settings
        run: |
          cd tmp_app
          python3 -c "
          import os
          import re
          for root, dirs, files in os.walk('android'):
              for f in files:
                  if f.startswith('settings.gradle'):
                      path = os.path.join(root, f)
                      text = open(path).read()
                      text = re.sub(r'com\.android\.application\"\s*version\s*\"[^\"]+\"', 'com.android.application\" version \"8.11.1\"', text)
                      text = re.sub(r'com\.android\.application\"\)\s*version\s*\"[^\"]+\"', 'com.android.application\") version \"8.11.1\"', text)
                      open(path, 'w').write(text)
          for root, dirs, files in os.walk('android/app'):
              for f in files:
                  if f.startswith('build.gradle'):
                      path = os.path.join(root, f)
                      text = open(path).read()
                      is_kts = f.endswith('.kts')
                      text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
                      text = text.replace('compileSdkVersion 34', 'compileSdkVersion 36')
                      text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', text)
                      text = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', text)
                      text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
                      text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
                      text = text.replace('jvmTarget = \"1.8\"', 'jvmTarget = \"17\"')
                      text = text.replace(\"jvmTarget = '1.8'\", \"jvmTarget = '17'\")
                      if is_kts:
                          if 'isCoreLibraryDesugaringEnabled' not in text: text = text.replace('compileOptions {', 'compileOptions {\n            isCoreLibraryDesugaringEnabled = true')
                          if 'multiDexEnabled' not in text: text = text.replace('defaultConfig {', 'defaultConfig {\n            multiDexEnabled = true')
                      else:
                          if 'coreLibraryDesugaringEnabled' not in text: text = text.replace('compileOptions {', 'compileOptions {\n            coreLibraryDesugaringEnabled true')
                          if 'multiDexEnabled' not in text: text = text.replace('defaultConfig {', 'defaultConfig {\n            multiDexEnabled true')
                      dep_str = 'coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")' if is_kts else \"coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\"
                      if 'desugar_jdk_libs' not in text:
                          if 'dependencies {' in text: text = text.replace('dependencies {', f'dependencies {{\n    {dep_str}')
                          else: text += f'\ndependencies {{\n    {dep_str}\n}}\n'
                      open(path, 'w').write(text)
          "

      - name: Build APK
        working-directory: ./tmp_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: match-companion-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
