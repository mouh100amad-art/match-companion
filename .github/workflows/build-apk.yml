name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create clean Flutter project and move code
        run: |
          # إنشاء مشروع جديد نظيف تماماً
          flutter create --org com.personal --project-name match_companion tmp_app
          
          # نسخ كود التطبيق الخاص بنا فقط
          cp -r lib tmp_app/
          cp pubspec.yaml tmp_app/
          cp -r assets tmp_app/ || true
          
      - name: Build APK inside new project
        working-directory: ./tmp_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: match-companion-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
