              'lib/services/hls_quality_parser.dart': '''
          import 'package:http/http.dart' as http;
          class StreamVariant { final String label; final String url; final int? height; final int? bandwidth; const StreamVariant({required this.label, required this.url, this.height, this.bandwidth}); }
          class HlsQualityParser {
            static Future<List<StreamVariant>> parse(String masterUrl) async {
              final uri = Uri.tryParse(masterUrl); if (uri == null || uri.scheme != 'https') return <StreamVariant>[];
              final response = await http.get(uri).timeout(const Duration(seconds: 12)); if (response.statusCode != 200) return <StreamVariant>[];
              final lines = response.body.split('\n'); final variants = <StreamVariant>[];
              for (var i = 0; i < lines.length; i++) {
                final line = lines[i].trim(); if (!line.startsWith('#EXT-X-STREAM-INF')) continue;
                final attrs = _parseAttributes(line); String? childUri;
                for (var j = i + 1; j < lines.length; j++) { final next = lines[j].trim(); if (next.isEmpty || next.startsWith('#')) continue; childUri = next; break; }
                if (childUri == null) continue; final absolute = uri.resolve(childUri).toString(); final resolution = attrs['RESOLUTION']; final height = int.tryParse(resolution == null ? '' : resolution.split('x').last); final bandwidth = int.tryParse(attrs['BANDWIDTH'] ?? '');
                variants.add(StreamVariant(label: _labelFor(height), url: absolute, height: height, bandwidth: bandwidth));
              }
              variants.sort((a, b) => (b.height ?? 0).compareTo(a.height ?? 0)); return variants;
            }
            static Map<String, String> _parseAttributes(String line) { final map = <String, String>{}; final index = line.indexOf(':'); if (index == -1) return map; final body = line.substring(index + 1); final pattern = RegExp(r'([A-Z0-9-]+)=(\"[^\"]*\"|[^,]*)'); for (final match in pattern.allMatches(body)) { map[match.group(1)!] = match.group(2)!.replaceAll('\"', '').trim(); } return map; }
            static String _labelFor(int? height) { if (height == null) return 'تلقائي'; if (height >= 2000) return '4K'; if (height >= 1000) return 'FHD 1080p'; if (height >= 700) return 'HD 720p'; if (height >= 400) return 'SD 480p'; return 'SD \${height}p'; }
          }
          ''',
              'lib/providers/settings_provider.dart': '''
          import 'package:flutter/material.dart';
          import '../services/storage_service.dart';
          class SettingsProvider extends ChangeNotifier {
            final StorageService _storage = StorageService();
            ThemeMode _themeMode = ThemeMode.system; String _apiKey = '3'; int _defaultReminder = 15;
            ThemeMode get themeMode => _themeMode; String get apiKey => _apiKey; int get defaultReminder => _defaultReminder;
            Future<void> load() async { _apiKey = await _storage.loadApiKey(); final mode = await _storage.loadThemeMode(); _themeMode = _parseThemeMode(mode); notifyListeners(); }
            Future<void> setThemeMode(ThemeMode mode) async { _themeMode = mode; await _storage.saveThemeMode(_themeMode.name); notifyListeners(); }
            Future<void> setApiKey(String value) async { _apiKey = value.trim().isEmpty ? '3' : value.trim(); await _storage.saveApiKey(_apiKey); notifyListeners(); }
            Future<void> setDefaultReminder(int minutes) async { _defaultReminder = minutes; notifyListeners(); }
            ThemeMode _parseThemeMode(String? value) { switch (value) { case 'light': return ThemeMode.light; case 'dark': return ThemeMode.dark; default: return ThemeMode.system; } }
          }
          ''',
              'lib/providers/matches_provider.dart': '''
          import 'package:flutter/foundation.dart';
          import '../models/match.dart'; import '../services/api_service.dart'; import '../services/storage_service.dart';
          class MatchesProvider extends ChangeNotifier {
            final ApiService _api = ApiService(); final StorageService _storage = StorageService();
            List<MatchEvent> _matches = <MatchEvent>[]; Set<String> _favorites = <String>{}; bool _loading = false; String? _error;
            List<MatchEvent> get matches => _matches; Set<String> get favorites => _favorites; bool get loading => _loading; String? get error => _error;
            List<MatchEvent> get favoriteMatches => _matches.where(isFavorite).toList();
            Future<void> load() async { _favorites = await _storage.loadFavorites(); await refresh(); }
            Future<void> refresh() async {
              _loading = true; _error = null; notifyListeners();
              try { _api.setKey(await _storage.loadApiKey()); final list = await _api.fetchUpcoming(); if (list.isEmpty) { final sample = await _api.loadSample(); _matches = sample; _error = sample.isEmpty ? 'لا توجد مباريات متاحة حالياً' : null; } else { _matches = list; } } catch (_) { _error = 'تعذر جلب المباريات. تحقق من اتصالك.'; if (_matches.isEmpty) { _matches = await _api.loadSample(); } } finally { _loading = false; notifyListeners(); }
            }
            String _keyFor(MatchEvent match) => '\${match.homeTeam}|\${match.awayTeam}';
            bool isFavorite(MatchEvent match) => _favorites.contains(_keyFor(match));
            Future<void> toggleFavorite(MatchEvent match) async { final key = _keyFor(match); if (_favorites.contains(key)) { _favorites.remove(key); } else { _favorites.add(key); } await _storage.saveFavorites(_favorites); notifyListeners(); }
            Future<void> clearFavorites() async { _favorites.clear(); await _storage.saveFavorites(_favorites); notifyListeners(); }
          }
          ''',
