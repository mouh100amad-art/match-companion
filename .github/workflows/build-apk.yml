name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Create project and generate ALL missing Dart files
        run: |
          flutter create --org com.personal --project-name match_companion tmp_app
          cp pubspec.yaml tmp_app/
          cp -r assets tmp_app/ || true
          cd tmp_app
          
          python3 -c "
          import os
          files = {
              'lib/main.dart': '''
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:intl/date_symbol_data_local.dart';
          import 'package:provider/provider.dart';
          import 'providers/matches_provider.dart';
          import 'providers/settings_provider.dart';
          import 'screens/home_screen.dart';
          import 'services/notification_service.dart';
          import 'theme/app_theme.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await initializeDateFormatting('ar', null);
            await NotificationService.instance.init();
            runApp(const MatchCompanionApp());
          }

          class MatchCompanionApp extends StatelessWidget {
            const MatchCompanionApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MultiProvider(
                providers: [
                  ChangeNotifierProvider(create: (_) => SettingsProvider()..load()),
                  ChangeNotifierProvider(create: (_) => MatchesProvider()..load()),
                ],
                child: Consumer<SettingsProvider>(
                  builder: (context, settings, _) {
                    return MaterialApp(
                      title: 'رفيق المباريات',
                      debugShowCheckedModeBanner: false,
                      theme: AppTheme.light,
                      darkTheme: AppTheme.dark,
                      themeMode: settings.themeMode,
                      locale: const Locale('ar'),
                      supportedLocales: const [Locale('ar')],
                      localizationsDelegates: const [
                        GlobalMaterialLocalizations.delegate,
                        GlobalWidgetsLocalizations.delegate,
                        GlobalCupertinoLocalizations.delegate,
                      ],
                      home: const HomeScreen(),
                    );
                  },
                ),
              );
            }
          }
          ''',
              'lib/theme/app_theme.dart': '''
          import 'package:flutter/material.dart';
          class AppTheme {
            static const Color seed = Color(0xFF1B5E20);
            static ThemeData get light => ThemeData(useMaterial3: true, colorScheme: ColorScheme.fromSeed(seedColor: seed), appBarTheme: const AppBarTheme(centerTitle: true));
            static ThemeData get dark => ThemeData(useMaterial3: true, colorScheme: ColorScheme.fromSeed(seedColor: seed, brightness: Brightness.dark), appBarTheme: const AppBarTheme(centerTitle: true));
          }
          ''',
              'lib/models/match.dart': '''
          class MatchEvent {
            final String id; final String league; final String homeTeam; final String awayTeam;
            final String? homeBadge; final String? awayBadge; final DateTime utcTime;
            final String? venue; final String? status; final int? homeScore; final int? awayScore;
            const MatchEvent({required this.id, required this.league, required this.homeTeam, required this.awayTeam, this.homeBadge, this.awayBadge, required this.utcTime, this.venue, this.status, this.homeScore, this.awayScore});
            DateTime get localTime => utcTime.toLocal();
            bool get isLive { final s = (status ?? '').toLowerCase(); return s == 'live' || s == '1h' || s == '2h' || s == 'ht'; }
            factory MatchEvent.fromSportsDb(Map<String, dynamic> json) {
              final raw = json['strTimestamp']?.toString() ?? '\${json['dateEvent'] ?? ''}T\${json['strTime'] ?? '00:00:00'}';
              DateTime utc; try { utc = DateTime.parse(raw).toUtc(); } catch (_) { utc = DateTime.now().toUtc(); }
              return MatchEvent(id: json['idEvent']?.toString() ?? raw, league: json['strLeague']?.toString() ?? 'غير معروف', homeTeam: json['strHomeTeam']?.toString() ?? '', awayTeam: json['strAwayTeam']?.toString() ?? '', homeBadge: json['strHomeTeamBadge']?.toString(), awayBadge: json['strAwayTeamBadge']?.toString(), utcTime: utc, venue: json['strVenue']?.toString(), status: json['strStatus']?.toString(), homeScore: int.tryParse(json['intHomeScore']?.toString() ?? ''), awayScore: int.tryParse(json['intAwayScore']?.toString() ?? ''));
            }
          }
          ''',
              'lib/utils/validators.dart': '''
          class Validators {
            static const Set<String> _blockedSchemes = {'file', 'content', 'javascript', 'data', 'blob'};
            static bool isSafeStreamUrl(String raw) {
              final text = raw.trim(); if (text.isEmpty) return false;
              final uri = Uri.tryParse(text); if (uri == null) return false;
              final scheme = uri.scheme.toLowerCase();
              if (scheme != 'https') return false; if (_blockedSchemes.contains(scheme)) return false;
              if (uri.host.isEmpty) return false; if (uri.userInfo.isNotEmpty) return false;
              return true;
            }
          }
          ''',
              'lib/services/storage_service.dart': '''
          import 'dart:convert';
          import 'package:shared_preferences/shared_preferences.dart';
          class StorageService {
            static const _favKey = 'favorites_v1'; static const _remindersKey = 'reminders_v1'; static const _apiKeyKey = 'api_key_v1'; static const _themeKey = 'theme_mode_v1';
            Future<Set<String>> loadFavorites() async { final prefs = await SharedPreferences.getInstance(); return (prefs.getStringList(_favKey) ?? <String>[]).toSet(); }
            Future<void> saveFavorites(Set<String> value) async { final prefs = await SharedPreferences.getInstance(); await prefs.setStringList(_favKey, value.toList()); }
            Future<String> loadApiKey() async { final prefs = await SharedPreferences.getInstance(); return prefs.getString(_apiKeyKey) ?? '3'; }
            Future<void> saveApiKey(String value) async { final prefs = await SharedPreferences.getInstance(); await prefs.setString(_apiKeyKey, value); }
            Future<Map<String, int>> loadReminders() async { final prefs = await SharedPreferences.getInstance(); final raw = prefs.getString(_remindersKey); if (raw == null) return <String, int>{}; try { final map = jsonDecode(raw) as Map<String, dynamic>; return map.map((k, v) => MapEntry(k, v as int)); } catch (_) { return <String, int>{}; } }
            Future<void> saveReminders(Map<String, int> value) async { final prefs = await SharedPreferences.getInstance(); await prefs.setString(_remindersKey, jsonEncode(value)); }
            Future<String?> loadThemeMode() async { final prefs = await SharedPreferences.getInstance(); return prefs.getString(_themeKey); }
            Future<void> saveThemeMode(String value) async { final prefs = await SharedPreferences.getInstance(); await prefs.setString(_themeKey, value); }
          }
          ''',
              'lib/services/api_service.dart': '''
          import 'dart:convert';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:http/http.dart' as http;
          import '../models/match.dart';
          class ApiService {
            static const String _base = 'https://www.thesportsdb.com/api/v1/json';
            static const List<int> _leagueIds = [4328, 4335, 4332, 4331, 4334, 4480];
            String _key = '3';
            void setKey(String value) { final trimmed = value.trim(); _key = trimmed.isEmpty ? '3' : trimmed; }
            Future<List<MatchEvent>> fetchUpcoming() async {
              final results = await Future.wait(_leagueIds.map(_fetchLeague));
              final all = results.expand((list) => list).toList();
              final seen = <String>{}; final unique = all.where((m) => seen.add(m.id)).toList();
              unique.sort((a, b) => a.utcTime.compareTo(b.utcTime));
              final cutoff = DateTime.now().toUtc().subtract(const Duration(hours: 3));
              return unique.where((m) => m.utcTime.isAfter(cutoff)).toList();
            }
            Future<List<MatchEvent>> _fetchLeague(int id) async {
              try { final uri = Uri.parse('\$_base/\$_key/eventsnextleague.php?id=\$id'); final response = await http.get(uri).timeout(const Duration(seconds: 10)); if (response.statusCode != 200) return <MatchEvent>[]; final data = jsonDecode(response.body); if (data is! Map<String, dynamic>) return <MatchEvent>[]; final events = data['events']; if (events is! List) return <MatchEvent>[]; return events.whereType<Map<String, dynamic>>().map(MatchEvent.fromSportsDb).toList(); } catch (_) { return <MatchEvent>[]; }
            }
            Future<List<MatchEvent>> loadSample() async {
              try { final raw = await rootBundle.loadString('assets/sample_matches.json'); final list = jsonDecode(raw); if (list is! List) return <MatchEvent>[]; return list.whereType<Map<String, dynamic>>().map(MatchEvent.fromSportsDb).toList(); } catch (_) { return <MatchEvent>[]; }
            }
          }
          ''',
              'lib/services/notification_service.dart': '''
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:flutter_timezone/flutter_timezone.dart';
          import 'package:timezone/data/latest.dart' as tzdata;
          import 'package:timezone/timezone.dart' as tz;
          import '../models/match.dart';

          class NotificationService {
            NotificationService._();
            static final NotificationService instance = NotificationService._();
            final FlutterLocalNotificationsPlugin _plugin = FlutterLocalNotificationsPlugin();
            bool _ready = false;

            Future<void> init() async {
              if (_ready) return;
              tzdata.initializeTimeZones();
              try { final dynamic info = await FlutterTimezone.getLocalTimezone(); final String name = info is String ? info : info.identifier as String; tz.setLocalLocation(tz.getLocation(name)); } catch (_) {}
              const android = AndroidInitializationSettings('ic_notification');
              const settings = InitializationSettings(android: android);
              await _plugin.initialize(settings);
              _ready = true;
            }

            Future<bool> requestPermissions() async {
              final android = _plugin.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>();
              if (android == null) return false;
              final granted = await android.requestNotificationsPermission() ?? false;
              try { await android.requestExactAlarmsPermission(); } catch (_) {}
              return granted;
            }

            int idFor(MatchEvent match) => match.id.hashCode & 0x7fffffff;

            Future<void> scheduleMatchReminder({required MatchEvent match, required int minutesBefore}) async {
              await init();
              final when = match.localTime.subtract(Duration(minutes: minutesBefore));
              if (!when.isAfter(DateTime.now())) return;
              final tzWhen = tz.TZDateTime.from(when, tz.local);
              const details = NotificationDetails(android: AndroidNotificationDetails('match_reminders', 'تذكير المباريات', channelDescription: 'إشعارات قبل انطلاق المباريات', importance: Importance.max, priority: Priority.high, icon: 'ic_notification'));
              await _plugin.zonedSchedule(
                idFor(match),
                '⏰ مباراة قريبة',
                '\${match.homeTeam} × \${match.awayTeam} تنطلق بعد \$minutesBefore دقيقة',
                tzWhen,
                details,
                androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle,
              );
            }

            Future<void> cancelReminder(MatchEvent match) async {
              await _plugin.cancel(idFor(match));
            }
          }
          ''',
