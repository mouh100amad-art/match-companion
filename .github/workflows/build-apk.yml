name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1' # الترقية للإصدار المطلوب
          channel: 'stable'
          cache: true

      - name: Create project, copy code, and force all Gradle settings
        run: |
          # 1. إنشاء المشروع النظيف
          flutter create --org com.personal --project-name match_companion tmp_app
          
          # 2. نسخ كود التطبيق
          cp -r lib tmp_app/
          cp pubspec.yaml tmp_app/
          cp -r assets tmp_app/ || true
          
          cd tmp_app

          # 3. تعديل settings.gradle لرفع AGP إلى 8.11.1
          sed -i 's/com.android.application" version "[^"]*"/com.android.application" version "8.11.1"/' android/settings.gradle

          # 4. تعديل build.gradle لفرض SDK 36 و Java 17 والإشعارات
          python3 -c "
          import re
          p = 'android/app/build.gradle'
          text = open(p).read()
          
          # فرض إصدارات SDK
          text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
          text = text.replace('compileSdkVersion 34', 'compileSdkVersion 36')
          text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', text)
          text = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 36', text)
          
          # فرض إعدادات Java 17
          text = text.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_17')
          text = text.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_17')
          text = text.replace('jvmTarget = \"1.8\"', 'jvmTarget = \"17\"')
          text = text.replace(\"jvmTarget = '1.8'\", \"jvmTarget = '17'\")
          
          # إضافة الإعدادات المطلوبة لمكتبة الإشعارات
          if 'coreLibraryDesugaringEnabled' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
          if 'desugar_jdk_libs' not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'')
              else:
                  text += '\ndependencies {\n    coreLibraryDesugaring \'com.android.tools:desugar_jdk_libs:2.1.4\'\n}\n'
          if 'multiDexEnabled' not in text:
              text = text.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')
                  
          open(p, 'w').write(text)
          print('✅ تم تعديل build.gradle بنجاح')
          "

          # 5. تأكيد إعدادات Gradle
          echo "org.gradle.jvmargs=-Xmx4G" >> android/gradle.properties
          
      - name: Build APK
        working-directory: ./tmp_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: match-companion-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
